name: arta

services:
  db:
    image: postgres:16-alpine
    container_name: arta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - arta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: arta-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      API_PORT: '4000'
      UPLOAD_DIR: /app/uploads
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_OPS: ${STRIPE_PRICE_OPS:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      TICKETING_SYNC_MODE: ${TICKETING_SYNC_MODE:-stub}
      TICKETING_SYNC_URL: ${TICKETING_SYNC_URL:-}
      TICKETING_SYNC_TOKEN: ${TICKETING_SYNC_TOKEN:-}
      SEED_PASSWORD: ${SEED_PASSWORD}
      SEED_PASS_ARTURO: ${SEED_PASS_ARTURO:-}
      SEED_PASS_CHACHO: ${SEED_PASS_CHACHO:-}
      SEED_PASS_RODRIGO: ${SEED_PASS_RODRIGO:-}
      SEED_PASS_WILLIAMS: ${SEED_PASS_WILLIAMS:-}
      SEED_PASS_LEIDA: ${SEED_PASS_LEIDA:-}
      SEED_PASS_JP: ${SEED_PASS_JP:-}
      SEED_PASS_MONSE: ${SEED_PASS_MONSE:-}
      SEED_PASS_MARISOL: ${SEED_PASS_MARISOL:-}
      SEED_PASS_KIKA: ${SEED_PASS_KIKA:-}
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - arta_uploads:/app/uploads
    networks:
      - internal
      - proxy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://arta-api:4000
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-artaproducciones.com}
        NEXT_PUBLIC_ARTA_HOST: ${NEXT_PUBLIC_ARTA_HOST:-arta.artaproducciones.com}
        NEXT_PUBLIC_AUDITORIO_HOST: ${NEXT_PUBLIC_AUDITORIO_HOST:-auditorio.artaproducciones.com}
    container_name: arta-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://arta-api:4000
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-artaproducciones.com}
      NEXT_PUBLIC_ARTA_HOST: ${NEXT_PUBLIC_ARTA_HOST:-arta.artaproducciones.com}
      NEXT_PUBLIC_AUDITORIO_HOST: ${NEXT_PUBLIC_AUDITORIO_HOST:-auditorio.artaproducciones.com}
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/login\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s
    networks:
      - internal
      - proxy

volumes:
  arta_pg:
  arta_uploads:

networks:
  internal:
  proxy:
    external: true