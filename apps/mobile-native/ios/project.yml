name: ArtaApp

# Única definición del proyecto Xcode: `ArtaApp.xcodeproj` NO se versiona, se
# genera con `xcodegen generate` (en el runner de macOS o en una Mac).
# Espejo de `NEXARA-app/apps/mobile-native/ios/project.yml`.

options:
  bundleIdPrefix: com.artaproducciones
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # La versión real la inyecta el flujo de publicación por línea de órdenes.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # API contra el que habla la app (Info.plist `ArtaApiBaseURL`). Para probar
    # contra otro servidor: `xcodebuild ... ARTA_API_BASE_URL=https://otro/api`.
    ARTA_API_BASE_URL: "https://arta.artaproducciones.com/api"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  # Solo FirebaseMessaging: el API manda los push con firebase-admin (FCM), que
  # no acepta tokens APNs crudos.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  ArtaApp:
    type: application
    platform: iOS
    sources:
      - path: ArtaApp
      - path: Resources/Assets.xcassets
      # Manifiesto de privacidad de la app: App Store Connect lo exige.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Configuración de cliente de Firebase (proyecto arta-app-fde07), versionada
      # como en NEXARA. Sin ella la app compila y arranca, pero no recibe push.
      - path: Resources/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      # Modo demo (solo Debug, `-ArtaDemo YES`): respuestas grabadas del API con
      # datos ficticios (`demo/grabar-fixtures.mjs`) para las capturas de tienda
      # sin login ni red. Referencia de carpeta: queda como `fixtures/` en el .app.
      # En Release se excluye con EXCLUDED_SOURCE_FILE_NAMES (abajo).
      - path: ../demo/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: Firebase
        product: FirebaseMessaging
      - target: NotificationService
        embed: true
    # Firma (estilo, equipo, perfil) en el xcconfig: el flujo de TestFlight la
    # sobreescribe por target sin tocar este archivo.
    configFiles:
      Debug: Config/ArtaApp.xcconfig
      Release: Config/ArtaApp.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artaproducciones.ops
        # Solo iPhone ("1"), como NEXARA: Apple revisó la 1.0 de NEXARA en un
        # iPad porque el binario declaraba "1,2" sin interfaz pensada ni probada
        # para iPad. Declarar iPad además obliga a subir capturas de 13" y a
        # hacer QA en iPad. Se vuelve a "1,2" solo cuando exista versión de iPad.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        # XcodeGen deja «iPhone Developer» a nivel de target y eso le gana al xcconfig: la
        # identidad sale de una variable que define Config/ArtaApp.xcconfig (o el
        # *.signing.xcconfig del flujo de TestFlight). Solo este target y la extensión.
        CODE_SIGN_IDENTITY: $(ARTA_CODE_SIGN_IDENTITY)
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": $(ARTA_CODE_SIGN_IDENTITY)
      configs:
        # APNs distingue entornos: TestFlight y App Store usan SIEMPRE production.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/ArtaApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/ArtaApp.Release.entitlements
          # Las fixtures del modo demo no viajan en la build de tienda (el código
          # del demo ya va dentro de `#if DEBUG`).
          EXCLUDED_SOURCE_FILE_NAMES: "fixtures */fixtures"

  # Capturas de App Store (XCUITest) en el simulador, con el modo demo. Las usa
  # `.github/workflows/ios-screenshots.yml`. Solo se construyen en la acción
  # `test` del esquema: ni `xcodebuild build` ni el archivado de TestFlight las
  # tocan. Sin firma: solo corren en simulador.
  ArtaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ArtaAppUITests
    dependencies:
      - target: ArtaApp
    settings:
      base:
        TEST_TARGET_NAME: ArtaApp
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.artaproducciones.ops.UITests
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO

  # Pone la cara de quien escribe en los avisos de chat (notificaciones de
  # comunicación, como WhatsApp). Ver NotificationService/NotificationService.swift.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/NotificationService.xcconfig
      Release: Config/NotificationService.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artaproducciones.ops.NotificationService
        # Igual que la app que la contiene (solo iPhone): ver ArtaApp arriba.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: $(ARTA_CODE_SIGN_IDENTITY)
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": $(ARTA_CODE_SIGN_IDENTITY)

# XcodeGen no crea esquemas compartidos por su cuenta, y `xcodebuild -scheme`
# solo ve los compartidos.
schemes:
  ArtaApp:
    build:
      targets:
        ArtaApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArtaAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
