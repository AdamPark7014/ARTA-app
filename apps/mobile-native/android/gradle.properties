org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.code.style=official

# Play Store: cada AAB que se suba a Play necesita un VERSION_CODE MAYOR que el
# último subido (aunque se descartara); Play nunca reutiliza uno. VERSION_NAME
# es el que ve la gente. 1 / 1.0.0 = Documents/ARTA-builds/arta-1.0.0-1.aab.
# Para el siguiente: pwsh -File scripts/build-play-aab.ps1 -BumpVersionCode
VERSION_CODE=2
VERSION_NAME=1.0.0
