## Traefik routing for ARTA Operaciones
##
## Hosts:
##   artaproducciones.com / www  → sitio público Arta
##   arta.artaproducciones.com   → panel ARTA
##   auditorio.artaproducciones.com → panel Auditorio
##
## /api y /uploads (paneles) van a arta-api con prioridad > Nexara.

http:
  routers:
    arta-http:
      rule: >-
        Host(`artaproducciones.com`) ||
        Host(`www.artaproducciones.com`) ||
        Host(`arta.artaproducciones.com`) ||
        Host(`auditorio.artaproducciones.com`)
      entryPoints: [web]
      middlewares: [redirect-https-arta]
      service: dummy-arta

    arta-api:
      rule: >-
        Host(`artaproducciones.com`,`www.artaproducciones.com`,
             `arta.artaproducciones.com`,`auditorio.artaproducciones.com`) &&
        PathPrefix(`/api`)
      entryPoints: [websecure]
      service: arta-api
      priority: 200
      middlewares: [arta-strip-api]
      tls:
        certResolver: letsencrypt

    arta-uploads:
      rule: >-
        Host(`artaproducciones.com`,`www.artaproducciones.com`,
             `arta.artaproducciones.com`,`auditorio.artaproducciones.com`) &&
        PathPrefix(`/uploads`)
      entryPoints: [websecure]
      service: arta-api
      priority: 200
      tls:
        certResolver: letsencrypt

    arta-public-https:
      rule: 'Host(`artaproducciones.com`,`www.artaproducciones.com`)'
      service: arta-web
      entryPoints: [websecure]
      priority: 50
      tls:
        certResolver: letsencrypt
        domains:
          - main: artaproducciones.com
            sans:
              - www.artaproducciones.com

    arta-https:
      rule: 'Host(`arta.artaproducciones.com`,`auditorio.artaproducciones.com`)'
      service: arta-web
      entryPoints: [websecure]
      priority: 50
      tls:
        certResolver: letsencrypt
        domains:
          - main: arta.artaproducciones.com
            sans:
              - auditorio.artaproducciones.com

  middlewares:
    redirect-https-arta:
      redirectScheme:
        scheme: https
        permanent: true
    arta-strip-api:
      stripPrefix:
        prefixes:
          - /api

  services:
    arta-web:
      loadBalancer:
        servers:
          - url: 'http://arta-web:3000'

    arta-api:
      loadBalancer:
        servers:
          - url: 'http://arta-api:4000'

    dummy-arta:
      loadBalancer:
        servers:
          - url: 'http://localhost'
