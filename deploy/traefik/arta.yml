## Traefik routing for ARTA Operaciones
##
## Hosts:
##   arta.artaproducciones.com       → panel ARTA + sitio /p/arta
##   auditorio.artaproducciones.com  → panel Auditorio (EXPLANADA)
##
## /api y /uploads van directo a arta-api (evita Invalid host header en rewrite).

http:
  routers:
    arta-http:
      rule: 'Host(`arta.artaproducciones.com`) || Host(`auditorio.artaproducciones.com`)'
      entryPoints: [web]
      middlewares: [redirect-https-arta]
      service: dummy-arta

    arta-api:
      rule: 'Host(`arta.artaproducciones.com`,`auditorio.artaproducciones.com`) && PathPrefix(`/api`)'
      entryPoints: [websecure]
      service: arta-api
      priority: 200
      middlewares: [arta-strip-api]
      tls:
        certResolver: letsencrypt

    arta-uploads:
      rule: 'Host(`arta.artaproducciones.com`,`auditorio.artaproducciones.com`) && PathPrefix(`/uploads`)'
      entryPoints: [websecure]
      service: arta-api
      priority: 200
      tls:
        certResolver: letsencrypt

    arta-https:
      rule: 'Host(`arta.artaproducciones.com`,`auditorio.artaproducciones.com`)'
      service: arta-web
      entryPoints: [websecure]
      priority: 50
      tls:
        certResolver: letsencrypt
        domains:
          - main: arta.artaproducciones.com
            sans:
              - auditorio.artaproducciones.com

  middlewares:
    redirect-https-arta:
      redirectScheme:
        scheme: https
        permanent: true
    # Browser calls /api/... ; Nest listens on /...
    arta-strip-api:
      stripPrefix:
        prefixes:
          - /api

  services:
    arta-web:
      loadBalancer:
        servers:
          - url: 'http://arta-web:3000'

    arta-api:
      loadBalancer:
        servers:
          - url: 'http://arta-api:4000'

    dummy-arta:
      loadBalancer:
        servers:
          - url: 'http://localhost'
