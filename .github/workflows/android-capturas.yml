name: Android · capturas de la entrada y la cartelera

# Para mirar la app antes de subirla a Play, sin emulador local. Sin cuenta ni secretos: la entrada y
# la cartelera pública traen datos reales de producción. Se lanza a mano; las capturas quedan como artefacto.
on:
  workflow_dispatch:

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile-native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar la app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Habilitar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          working-directory: apps/mobile-native/android
          script: python3 scripts/capturas-cartelera.py app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/capturas"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-capturas
          path: ${{ runner.temp }}/capturas
          if-no-files-found: warn
