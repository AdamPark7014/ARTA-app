name: Android · video de ubicación para Play

# Graba en un emulador el recorrido que pide la declaración de servicio en primer plano
# (docs/store/PLAY-STORE.md § 5.7). Se lanza a mano; el video queda como artefacto.
on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile-native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar la app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Habilitar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Grabar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          working-directory: apps/mobile-native/android
          script: python3 scripts/grabar-video-ubicacion.py app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ARTA-ubicacion.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-video-ubicacion
          path: ${{ runner.temp }}/ARTA-ubicacion.mp4
          if-no-files-found: warn
