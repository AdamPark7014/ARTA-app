name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — typecheck, unit + e2e tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arta
          POSTGRES_PASSWORD: arta
          POSTGRES_DB: arta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arta:arta@localhost:5432/arta_test?schema=public
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate

      - name: Prisma migrate deploy (test DB)
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: apps/api
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: apps/api
        run: npm test

      - name: E2E tests (real DB — tenant isolation, etc.)
        working-directory: apps/api
        run: npx jest --config test/jest-e2e.config.js --runInBand
        env:
          # setup-env.js derives the test DB name from DATABASE_URL; already arta_test here.
          CI: true

      - name: Build
        working-directory: apps/api
        run: npm run build

  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_ROOT_DOMAIN: artaproducciones.com
          NEXT_PUBLIC_ARTA_HOST: arta.artaproducciones.com
          NEXT_PUBLIC_AUDITORIO_HOST: auditorio.artaproducciones.com
        run: npm run build
